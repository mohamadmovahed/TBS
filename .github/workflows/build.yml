name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libzmq3-dev libavformat-dev libavcodec-dev libswscale-dev libavutil-dev libswresample-dev qt6-multimedia-dev libsrt-gnutls-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  library-only:
    # The library must build without Qt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DTBS_BUILD_GUI=OFF -DTBSDVB_ENABLE_ZMQ=OFF -DTBSDVB_BUILD_SHARED=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    # Unit and end-to-end tests under AddressSanitizer + UBSan, and ThreadSanitizer
    # for the capture/processing pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libsrt-gnutls-dev pkg-config
      - name: ASan + UBSan
        run: |
          cmake -S . -B build-asan -DTBS_SANITIZE=ON -DTBS_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-asan -j
          ctest --test-dir build-asan --output-on-failure
      - name: ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -DTBS_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan -j
          ctest --test-dir build-tsan --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build fuzzers
        run: |
          cmake -S . -B build-fuzz -DTBS_BUILD_FUZZERS=ON -DTBS_BUILD_GUI=OFF -DTBSDVB_ENABLE_ZMQ=OFF \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-fuzz -j
      - name: Replay corpus and regressions
        run: ctest --test-dir build-fuzz -R fuzz-regress --output-on-failure
      - name: Fuzz each target for 60 s
        run: |
          for t in bbframes pseudots psi gse dvbtext capture; do
            mkdir -p work/$t && cp fuzz/corpus/$t/* work/$t/
            ./build-fuzz/fuzz/fuzz_$t -max_total_time=60 -max_len=65536 -artifact_prefix=crash-$t- work/$t
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*

  mingw-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake -DTBS_BUILD_GUI=OFF -DTBSDVB_ENABLE_ZMQ=OFF
      - name: Build
        run: cmake --build build-win -j

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt zeromq ffmpeg srt pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
      - name: Install ZeroMQ (vcpkg)
        run: vcpkg install zeromq:x64-windows
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DTBS_ENABLE_FFMPEG=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
